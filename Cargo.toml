[package]
name = "rustpaint"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustpaint"
path = "src/lib.rs"

[[bin]]
name = "rustpaint"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = { version = "0.31", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.14"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
